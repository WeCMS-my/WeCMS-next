name: Quality Gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      skip_mysql_integration_tests:
        description: "Skip MySQL integration tests in backend quality gate"
        type: boolean
        required: false
        default: true

permissions:
  contents: read

jobs:
  backend-quality-gate:
    name: Backend quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: wecms_dev
          MYSQL_USER: wecms_dev
          MYSQL_PASSWORD: wecms_dev
          MYSQL_ROOT_PASSWORD: wecms_root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      WECMS_SKIP_MYSQL_INTEGRATION_TESTS: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.skip_mysql_integration_tests == true && 'true' || 'false') || 'false' }}
      WECMS_TEST_MYSQL_CONNECTION_STRING: "server=127.0.0.1;port=3306;database=wecms_dev;uid=wecms_dev;pwd=wecms_dev;charset=utf8mb4;SslMode=None;"
      WECMS_FRONTEND_BASE_REF: ${{ github.base_ref || 'main' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install quality gate tools
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Fetch frontend diff base
        run: git fetch --no-tags origin "${WECMS_FRONTEND_BASE_REF}:${WECMS_FRONTEND_BASE_REF}" || true

      - name: Restore backend
        run: dotnet restore backend/WeCms.slnx

      - name: Run backend quality gate
        run: bash scripts/quality-gate-backend.sh

  frontend-quality-gate:
    name: Frontend quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Setup pnpm 10.5.0
        uses: pnpm/action-setup@v4
        with:
          version: 10.5.0

      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('frontend/soybean-admin/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Run frontend quality gate
        run: bash scripts/quality-gate-frontend.sh
