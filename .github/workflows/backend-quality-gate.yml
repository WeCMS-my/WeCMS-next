name: Backend Quality Gate

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'database/**'
      - 'scripts/**'
      - '.github/workflows/backend-quality-gate.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'database/**'
      - 'scripts/**'
      - '.github/workflows/backend-quality-gate.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Backend Quality Gate
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: wecms_dev_pass
          MYSQL_DATABASE: wecms_dev
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Restore dependencies
        run: dotnet restore backend/WeCms.slnx

      - name: Ensure Linux AOT toolchain (objcopy / llvm-objcopy)
        if: runner.os == 'Linux'
        run: |
          if command -v llvm-objcopy >/dev/null 2>&1 || command -v objcopy >/dev/null 2>&1; then
            echo "AOT symbol strip tool already available."
          else
            echo "Installing symbol strip tools for linux native AOT..."
            sudo apt-get update
            sudo apt-get install -y llvm binutils
          fi

      # ── 统一质量门禁（backend + DI scan） ──
      - name: Run backend quality gate (all)
        run: bash scripts/quality-gate-backend.sh all
        env:
          WeCMS__ConnectionStrings__Default: >-
            Server=127.0.0.1;Port=3306;Database=wecms_dev;User=root;Password=wecms_dev_pass;Charset=utf8mb4;

      # ── Summary ──
      - name: Quality Gate Summary
        if: always()
        run: |
          echo "=== WeCMS M0-BE Backend Quality Gate ==="
          if [ "${{ job.status }}" = "success" ]; then
            echo "Result: PASSED"
          else
            echo "Result: FAILED"
          fi
