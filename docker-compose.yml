services:
  mysql:
    image: mysql:8.4
    container_name: wecms-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: wecms-root-123
      MYSQL_DATABASE: wecms_dev
      MYSQL_USER: wecms
      MYSQL_PASSWORD: wecms-dev-123
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pwecms-root-123"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql-data:
